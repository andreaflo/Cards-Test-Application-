version: "3.9"

services:
  db:
    image: postgres:15
    container_name: card-app-postgres
    environment:
      POSTGRES_DB: cardsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - card-app-postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: card-app-backend
    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cardsdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_SHOW_SQL: "true"
      #JAVA_TOOL_OPTIONS: >
       # -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

  frontend:
    build:
      context: ./frontend  # Indica a Docker di guardare dentro la sottocartella
      dockerfile: Dockerfile
    container_name: card-app-frontend
    ports:
    - "5173:5173"
    depends_on:
    - backend

volumes:
  card-app-postgres-data: